global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Scrape Express Backend API
  - job_name: 'cricket-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000', 'host.docker.internal:5000']
        labels:
          service: 'express-backend'
          environment: 'production'

  # 2. Scrape Python FastAPI ML Microservice
  - job_name: 'cricket-ml-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ml-api:8000', 'host.docker.internal:8000']
        labels:
          service: 'fastapi-ml'
          environment: 'production'

  # 3. Prometheus Self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
