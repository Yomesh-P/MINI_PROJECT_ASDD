apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: cricket
data:
  NODE_ENV: "production"
  PORT: "5000"
  MONGO_URI: "mongodb://mongo:27017/cricket_tracker"
  ML_SERVICE_URL: "http://ml-api:8000"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: cricket
type: Opaque
stringData:
  JWT_SECRET: "k8s-prod-cricket-jwt-secret-key-2025"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cricket
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: cricket-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cricket
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  selector:
    app: backend
