name: Continuous Deployment (Main Branch)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Build, Push & Deploy to K3s
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Commit Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # In production on AWS, docker/login-action logs into Docker Hub or AWS ECR
      - name: Build & Tag Images
        run: |
          echo "Building production container images for commit ${{ steps.vars.outputs.sha_short }}"
          docker build -t cricket-backend:${{ steps.vars.outputs.sha_short }} backend/
          docker build -t cricket-frontend:${{ steps.vars.outputs.sha_short }} frontend/
          docker build -t cricket-ml-api:${{ steps.vars.outputs.sha_short }} ml-service/

      - name: Apply Kubernetes Manifests to Cluster
        run: |
          echo "Applying manifests to K3s cluster on AWS EC2..."
          # kubectl apply -f k8s/
          # kubectl rollout status deployment/backend -n cricket
